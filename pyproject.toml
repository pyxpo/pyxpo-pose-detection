[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-pose-detection"
dynamic = ["version"]
description = "On-device human pose detection for pyxpo apps: 17 body landmarks from a photo or every frame of a video (ML Kit on Android, Vision on iOS)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "ios", "pose", "pose-estimation", "body-tracking", "ml-kit", "vision", "keypoints"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Android",
    "Operating System :: iOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a1,<0.2"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo/tree/main/packages/pose-detection"
Documentation = "https://github.com/pyxpo/pyxpo/blob/main/packages/pose-detection/README.md"
Changelog = "https://github.com/pyxpo/pyxpo/blob/main/packages/pose-detection/CHANGELOG.md"
Source = "https://github.com/pyxpo/pyxpo/tree/main/packages/pose-detection"
Issues = "https://github.com/pyxpo/pyxpo/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
pose-detection = "pyxpo_pose_detection"

[tool.setuptools]
packages = ["pyxpo_pose_detection"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_pose_detection.__version__" }

[tool.setuptools.package-data]
pyxpo_pose_detection = ["pyxpo-module.json", "py.typed", "ios/**/*", "android/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]
